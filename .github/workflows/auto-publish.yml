name: Auto publish nuget on version bump

on:
  push:
    branches-ignore: [main]
    
permissions:
  contents: read
  actions: write
  packages: read

jobs:
  test:
    uses: ./.github/workflows/run-tests.yml
    with:
      display-name: Pre-publish build and test

  check-and-publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Add GitHub Packages source
        run: dotnet nuget add source "https://nuget.pkg.github.com/jeppevammenkristensen/index.json" --name "github" --username jeppevammenkristensen --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text
      - id: version
        name: Check if version was bumped
        shell: pwsh
        run: dotnet run (Join-Path Scripts check-version-bumped.cs) -- ${{ github.event.before }}
      - name: Trigger publish workflow
        if: steps.version.outputs.bumped == 'true'
        run: gh workflow run publish.yml --ref ${{ github.ref_name }} -f target=code-filebasedapp -f environment=staging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
