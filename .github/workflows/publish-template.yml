# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Publish nuget packages for template

# Publish can be triggered manually.

on:
  workflow_dispatch:  

jobs:
  build-and-publish:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x    
    - name: Build-And-Publish-Code
      shell: pwsh
      run: dotnet run (Join-Path Scripts build-and-publish-nuget-packages.cs) -- build-template -c Release --source nuget.org
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
