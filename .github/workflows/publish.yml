name: Publish nuget packages

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to publish'
        required: true
        type: choice
        options:
          - code-all
          - code-filebasedapp
          - code-truepath
          - template
      environment:
        description: 'Where to publish'
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    env:
      NUGET_SOURCE: ${{ inputs.environment == 'production' && 'nuget.org' || 'https://nuget.pkg.github.com/jeppevammenkristensen/index.json' }}
      NUGET_API_KEY: ${{ inputs.environment == 'production' && secrets.NUGET_API_KEY || secrets.GITHUB_TOKEN }}

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Publish template
      if: inputs.target == 'template'
      shell: pwsh
      run: dotnet run (Join-Path Scripts build-and-publish-nuget-packages.cs) -- build-template --source $env:NUGET_SOURCE
      env:
        NUGET_API_KEY: ${{ env.NUGET_API_KEY }}
    - name: Publish code
      if: inputs.target != 'template'
      shell: pwsh
      run: |
        $codeMap = @{
          'code-all' = 'All'
          'code-filebasedapp' = 'FileBaseApp'
          'code-truepath' = 'TruePath'
        }
        $codeToBuild = $codeMap['${{ inputs.target }}']
        dotnet run (Join-Path Scripts build-and-publish-nuget-packages.cs) -- build-code -c Release --source $env:NUGET_SOURCE --code-to-build $codeToBuild
      env:
        NUGET_API_KEY: ${{ env.NUGET_API_KEY }}
