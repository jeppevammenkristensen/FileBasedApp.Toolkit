name: Run tests

on:
  workflow_call:
    inputs:
      display-name:
        description: 'The job name shown in the Actions UI, so callers can distinguish their runs'
        required: false
        type: string
        default: 'Build and test'

jobs:
  result:
    # Keep the required check name stable when the SDK matrix changes.
    name: ${{ inputs.display-name }}
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Check all SDK results
      shell: bash
      env:
        BUILD_RESULT: ${{ needs.build.result }}
      run: |
        if [[ "$BUILD_RESULT" != "success" ]]; then
          echo "::error::SDK build and test jobs did not all succeed (result: $BUILD_RESULT)"
          exit 1
        fi

  build:
    name: ${{ inputs.display-name }} (SDK ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: 10.0.x
            quality: ga
            target-arguments: --target-framework net10.0
          - sdk: 11.0.x
            quality: ga
            target-arguments: ""
    permissions:
      packages: read
    steps:
    - uses: actions/checkout@v7
    # Multi-target tests need the .NET 10 runtime even when building with SDK 11.
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Setup matrix SDK
      id: setup-sdk
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ matrix.sdk }}
        dotnet-quality: ${{ matrix.quality }}
    - name: Select and verify matrix SDK
      shell: pwsh
      env:
        SDK_VERSION: ${{ steps.setup-sdk.outputs.dotnet-version }}
      run: |
        @{
          sdk = @{
            version = $env:SDK_VERSION
            rollForward = 'disable'
            allowPrerelease = $true
          }
        } | ConvertTo-Json | Set-Content global.json
        $selectedSdk = dotnet --version
        if ($LASTEXITCODE -ne 0 -or $selectedSdk -ne $env:SDK_VERSION) {
          throw "Expected SDK $env:SDK_VERSION, got $selectedSdk"
        }
        dotnet --info
    - name: Add GitHub Packages source
      run: dotnet nuget add source "https://nuget.pkg.github.com/jeppevammenkristensen/index.json" --name "github" --username jeppevammenkristensen --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text
    - name: Test
      shell: pwsh
      run: dotnet run (Join-Path Scripts build-and-run-test.cs) --run-all-test ${{ matrix.target-arguments }}
    - name: Upload build artifact
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: build-output-sdk-${{ matrix.sdk }}
        path: test-reports/
        # Keep for 7 days (default is 90)
        retention-days: 7
